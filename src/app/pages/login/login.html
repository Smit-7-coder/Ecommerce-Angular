<div class="parent">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 login-card">
      <h3 class="text-center mb-4">Login</h3>

      <form [formGroup]="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter Email" formControlName="userName" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Enter Password" formControlName="password" />
        </div>

        <button type="button" (click)="onLogin()">
          Login
        </button>
        <p>Don't have an account? <button style="border: none; color: blue; background: none;" (click)="goToRegister()">Create
            Account</button></p>
      </form>
    </div>
  </div>
</div>
